
<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的医学复习室 ♡</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #fff1f5;

    header {

      max-width: 650px;
      margin: 30px auto;
      padding: 0 20px;

      background: white;
      border: 1px solid #ffe0e9;
      border-radius: 20px;
      padding: 22px;
      margin: 14px 0;
      box-shadow: 0 5px 18px #f8c4d333;
    }
    .course h3 { margin: 0 0 8px; }
    .course p { color: #927381; font-size: 14px; }
    button {
      background: #f05287;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #e5ccd5;
      cursor: not-allowed;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #ae8294;
      font-size: 13px;
