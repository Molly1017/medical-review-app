<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的医学复习室 ♡</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#63384b;background:#fff2f6}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:35px 15px;background:linear-gradient(120deg,#ffe0ea,#ffc0d7);border-radius:0 0 28px 28px}h1{margin:8px 0}main{max-width:760px;margin:25px auto;padding:0 16px}.panel{background:white;border:1px solid #ffd7e4;border-radius:18px;padding:19px;margin:13px 0;box-shadow:0 5px 15px #efacc01c}.muted{color:#926d7e;font-size:14px}button,select{font:inherit;border-radius:11px;padding:11px 15px}button{border:0;background:#f04f88;color:white;font-weight:600;cursor:pointer}button.secondary{background:#fff0f5;color:#a52d5b;border:1px solid #f8c7d8}button:disabled{opacity:.45;cursor:default}select,textarea{width:100%;border:1px solid #efcbd7;background:white;color:#63384b}select{margin:6px 0 12px}textarea{padding:12px;border-radius:12px;min-height:115px}label.opt{display:block;border:1px solid #f4d4df;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}label.opt:has(input:checked){background:#ffe4ee;border-color:#f04f88}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}.pill{display:inline-block;background:#fff0f5;color:#a52d5b;padding:5px 10px;border-radius:30px;font-size:12px}#feedback{margin-top:12px;white-space:pre-wrap;line-height:1.7}.question{white-space:pre-wrap;line-height:1.75;font-size:18px}.nav-toggle{margin:10px 0 4px}.nav-panel{max-height:230px;overflow:auto;background:#fff7fa;border:1px solid #f8d5e1;border-radius:14px;padding:10px}.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}.nav-item{padding:8px 4px;border:1px solid #f4d4df;border-radius:9px;background:#fff;color:#8d6173;cursor:pointer}.nav-item.answered{background:#ffe4ee;color:#a52d5b}.nav-item.wrong{border-color:#d83c72;color:#c32860;font-weight:700}.nav-item.review{border-style:dashed;color:#9b7b89}.nav-item.current{background:#f04f88;color:#fff;border-color:#f04f88}.details-toggle{margin-top:10px}.explanation-card{margin-top:10px;padding:14px;border:1px solid #f5c8da;border-radius:14px;background:#fff8fb}.explanation-card h3{margin:8px 0;color:#a52d5b;font-size:16px}.explanation-card p{margin:6px 0;line-height:1.65}.case-context{white-space:pre-wrap;line-height:1.7;background:#fff7fa;border:1px solid #f8d5e1;border-radius:14px;padding:13px;margin:12px 0;color:#805068}footer{text-align:center;color:#ad8194;padding:30px;font-size:13px}</style></head><body>
<header><div>🌸 MEDICAL REVIEW 🌸</div><h1>我的医学复习室 ♡</h1><p>每天进步一点点，离梦想中的医生更近一点。</p></header><main>
<section class="panel"><h2>🍓 选择课程</h2><label for="course">课程</label><select id="course"><option value="医学微生物学">🦠 医学微生物学</option><option value="医学免疫学">🧬 医学免疫学</option><option value="医学细胞生物学">🔬 医学细胞生物学</option></select><label for="chapter">章节</label><select id="chapter"><option value="">全部章节</option></select><label for="type">题型</label><select id="type"><option value="">全部题型</option></select><div class="actions"><button id="start">开始复习</button><button id="wrong" class="secondary">只看错题</button><button id="all" class="secondary">恢复全部题目</button></div><p id="stats" class="muted">正在加载题库…</p></section>
<section id="quiz" class="panel hidden"><div id="meta" class="muted"></div><h2 id="title">练习题</h2><button id="toggleNav" class="secondary nav-toggle" type="button" aria-expanded="false">题目导航</button><div id="navPanel" class="nav-panel hidden"><div id="questionNav" class="nav-grid"></div></div><div id="caseContext" class="case-context hidden"></div><div id="question" class="question"></div><div id="answers"></div><div class="actions"><button id="check">提交答案</button><button id="reveal" class="secondary">查看参考答案</button><button id="prev" class="secondary">← 上一题</button><button id="next" class="secondary">下一题 →</button></div><div id="feedback"></div><button id="detailsToggle" class="secondary details-toggle hidden" type="button">查看详细解析</button><div id="explanationCard" class="explanation-card hidden"></div></section>
<section class="panel"><strong>📖 使用说明</strong><p class="muted">选择题在答案完整且经过初步结构检查时提供自动判分；其他题型可先作答再查看参考答案。原始题库中的待审核记录不参与自动判分，不能将初步状态视为医学内容已全部核实。错题记录仅保存在当前浏览器中，清理浏览器数据可能丢失。</p></section>
</main><footer>Made with ♡ · Medical Review</footer><script>
let questions=[],pool=[],position=0,wrongOnly=false,activeQuestionId=null,caseData={},chapterOrder={};const answerDrafts={};const $=id=>document.getElementById(id);const course=$('course'),chapter=$('chapter'),type=$('type');const key='medical-review-wrong-v1';let wrong={};try{wrong=JSON.parse(localStorage.getItem(key)||'{}')}catch{};
const text=(node,value)=>node.textContent=value==null?'':String(value);function quizType(q){if(['单选题','多选题'].includes(q.type))return '选择题';if(q.type==='判断题')return '判断题';if(q.type==='填空题')return '填空题';if(q.type==='名词解释')return '名词解释';return ''}function visible(q){return !q.exclude_from_quiz&&Boolean(quizType(q))}const cnDigits={零:0,〇:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,百:100};function chapterNumber(value){let m=String(value||'').match(/^第([一二三四五六七八九十百〇零两\\d]+)章/);if(!m)return Number.MAX_SAFE_INTEGER;let raw=m[1];if(/^\\d+$/.test(raw))return Number(raw);let total=0,section=0;for(const ch of raw){let n=cnDigits[ch];if(n===10||n===100){section=(section||1)*n;total+=section;section=0}else section=section*10+n}return total+section}function uniq(a){return [...new Set(a.filter(Boolean))].sort((x,y)=>chapterNumber(x)-chapterNumber(y)||String(x).localeCompare(String(y),'zh-CN'))};function orderedChapters(a){let order=chapterOrder[course.value]||[],rank=new Map(order.map((v,i)=>[v,i]));return [...new Set(a.filter(Boolean))].sort((x,y)=>(rank.get(x)??9999)-(rank.get(y)??9999)||chapterNumber(x)-chapterNumber(y)||String(x).localeCompare(String(y),'zh-CN'))};function fill(el,items,first){el.replaceChildren(new Option(first,''));items.forEach(v=>el.add(new Option(v,v)))};
function changeCourse(){let q=questions.filter(x=>x.course===course.value&&visible(x));fill(chapter,orderedChapters(q.map(x=>x.chapter)),'全部章节');changeChapter()};function changeChapter(){let q=questions.filter(x=>x.course===course.value&&visible(x)&&(!chapter.value||x.chapter===chapter.value));fill(type,uniq(q.map(x=>quizType(x))),'全部题型');updateStats()};function filtered(){return questions.filter(x=>x.course===course.value&&visible(x)&&(!chapter.value||x.chapter===chapter.value)&&(!type.value||quizType(x)===type.value)&&(!wrongOnly||wrong[x.id]))};function updateStats(){text($('stats'),`当前筛选：${filtered().length} 道题 · 本机记录错题 ${Object.keys(wrong).length} 道`)};
function renderExplanation(q){let d=q.explanation_detail;if(!d){$('detailsToggle').classList.add('hidden');$('explanationCard').classList.add('hidden');return}let options=Object.entries(d.option_analysis||{}).map(([k,v])=>`<p><strong>${k}.</strong> ${v}</p>`).join('');$('explanationCard').innerHTML=`<h3>正确答案及原因</h3><p>${d.correct_answer_reason||''}</p><h3>通俗解释</h3><p>${d.plain_explanation||''}</p>${options?'<h3>选项分析</h3>'+options:''}<h3>临床联系</h3><p>${d.clinical_connection||'本题暂无额外临床联系。'}</p><h3>考试重点</h3><p>${d.exam_focus||''}</p><p class="muted">解析来源：${d.source?.kind==='original_source_derived'?'根据原始题库内容整理':(d.source?.file||'待审核')}</p>`;$('detailsToggle').classList.add('hidden');$('explanationCard').classList.add('hidden');$('detailsToggle').textContent='查看详细解析'};function renderNav(){let nav=$('questionNav');if(!nav)return;nav.replaceChildren();pool.forEach((q,i)=>{let b=document.createElement('button');b.type='button';b.className='nav-item';b.textContent=String(i+1);let d=answerDrafts[q.id];if(d&&((d.picked&&d.picked.length)||String(d.free||'').trim()))b.classList.add('answered');if(wrong[q.id])b.classList.add('wrong');if(q.needs_review||q.status==='needs_review'||q.status==='needs_review_conflicting_answers')b.classList.add('review');if(i===position)b.classList.add('current');b.title=`第${i+1}题${q.needs_review?'（待审核）':''}`;b.onclick=()=>{saveCurrentAnswer();position=i;show()};nav.append(b)})};function saveCurrentAnswer(){if(!activeQuestionId)return;let picked=[...document.querySelectorAll('#answers input:checked')].map(x=>x.value);let free=$('free');answerDrafts[activeQuestionId]={picked,free:free?free.value:''}};function restoreAnswer(q){let draft=answerDrafts[q.id];if(!draft)return;draft.picked.forEach(v=>{let input=document.querySelector(`#answers input[value=\"${CSS.escape(v)}\"]`);if(input)input.checked=true});let free=$('free');if(free)free.value=draft.free||''}function show(){saveCurrentAnswer();if(!pool.length){activeQuestionId=null;$('quiz').classList.add('hidden');text($('stats'),'当前筛选下没有题目，请更换筛选条件。');return}let q=pool[position];activeQuestionId=q.id;$('quiz').classList.remove('hidden');let c=q.case_id?caseData[q.case_id]:null;let caseText=c?` · ${c.title}${q.case_subquestion?` · 第${q.case_subquestion}小题`:''}`:'';text($('meta'),`${position+1} / ${pool.length} · ${q.course} · ${q.chapter||'未标注章节'} · ${q.type||'其他'} · ${q.status||'待审核'}${caseText}`);if(c){$('caseContext').classList.remove('hidden');text($('caseContext'),`${c.title}\n${c.background}`)}else{$('caseContext').classList.add('hidden');text($('caseContext'),'')}text($('question'),q.question||'题干缺失');$('answers').replaceChildren();text($('feedback'),'');renderExplanation(q);let opts=q.options&&typeof q.options==='object'?Object.entries(q.options).filter(([k,v])=>v).sort(([a],[b])=>String(a).localeCompare(String(b))):[];if(q.type==='判断题'){opts=[['正确','正确'],['错误','错误']]}if(opts.length){opts.forEach(([k,v])=>{let l=document.createElement('label');l.className='opt';let input=document.createElement('input');input.type=q.type==='多选题'?'checkbox':'radio';input.name='choice';input.value=k;l.append(input,document.createTextNode(' '+(q.type==='判断题'?'':k+'. ')+v));$('answers').append(l)})}else{let a=document.createElement('textarea');a.id='free';a.placeholder=q.type==='名词解释'?'请先输入你记得的定义，再点击“查看参考答案”':'可以先在这里写下你的答案，再点击“查看参考答案”';$('answers').append(a)}restoreAnswer(q);$('check').disabled=!(q.type==='判断题'||opts.length);$('check').hidden=q.type!=='判断题'&&!opts.length;$('prev').disabled=position===0;$('next').disabled=position===pool.length-1;renderNav();window.scrollTo({top:$('quiz').offsetTop-15,behavior:'smooth'})}
function start(){saveCurrentAnswer();pool=filtered();position=0;show();updateStats()};function canGrade(q){if(!['ready','externally_verified_correction'].includes(q.status)||q.answer==null)return false;if(q.type==='判断题')return ['正确','错误'].includes(String(q.answer));return ['单选题','多选题'].includes(q.type)&&Object.keys(q.options||{}).length===5};function normalize(a){return String(a||'').toUpperCase().replace(/[^A-E正确错误]/g,'').split('').sort().join('')};function answerText(q){let answer=q.answer||q.reference_answer;return answer==null||answer===''?'当前记录待人工审核。':String(answer)}function answerSource(q){if(q.answer_source==='original_source')return '原始题库：'+(q.answer_source_file||'未知来源')+' '+(q.answer_source_location||'');if(q.answer_source==='externally_verified')return '外部资料核实';return '待审核'};
$('check').onclick=()=>{saveCurrentAnswer();let q=pool[position],picked=[...document.querySelectorAll('#answers input:checked')].map(x=>x.value).sort().join('');if(!picked){text($('feedback'),'请先选择答案。');return}if(!canGrade(q)){text($('feedback'),`本题暂不自动判分。\n原始答案：${answerText(q)}\n审核状态：${q.status||'未知'}\n答案来源：${answerSource(q)}`);return}let correct=normalize(picked)===normalize(q.answer);if(!correct){wrong[q.id]=true;try{localStorage.setItem(key,JSON.stringify(wrong))}catch{}}text($('feedback'),`${correct?'✅ 回答正确！':'❌ 回答不正确，已加入错题本。'}\n参考答案：${answerText(q)}${q.explanation?'\n解析：'+q.explanation:''}`);updateStats();renderNav();if(q.explanation_detail){$('detailsToggle').classList.remove('hidden')}};
$('reveal').onclick=()=>{saveCurrentAnswer();let q=pool[position];text($('feedback'),`参考答案：${answerText(q)}${q.explanation?'\n解析：'+q.explanation:''}\n审核状态：${q.status||'未知'}${q.status!=='ready'?'（请注意核实）':''}\n答案来源：${answerSource(q)}`);if(q.explanation_detail){$('detailsToggle').classList.remove('hidden')}};$('prev').onclick=()=>{if(position>0){position--;show()}};$('next').onclick=()=>{if(position<pool.length-1){position++;show()}};$('start').onclick=()=>{wrongOnly=false;start()};$('wrong').onclick=()=>{wrongOnly=true;start()};$('all').onclick=()=>{wrongOnly=false;start()};$('detailsToggle').onclick=()=>{let hidden=$('explanationCard').classList.toggle('hidden');$('detailsToggle').textContent=hidden?'查看详细解析':'收起详细解析'};$('toggleNav').onclick=()=>{let open=$('navPanel').classList.toggle('hidden');$('toggleNav').setAttribute('aria-expanded',String(!open))};course.onchange=()=>{changeCourse();start()};chapter.onchange=start;type.onchange=start;
fetch('./medical_question_bank_deduplicated.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{questions=Array.isArray(data)?data:(data.questions||[]);caseData=data.cases||{};chapterOrder=data.chapter_order||{};changeCourse();text($('stats'),`题库已加载：${questions.length} 道记录。请选择课程开始复习。`)}).catch(e=>{text($('stats'),'题库加载失败：'+e.message+'。请检查 JSON 文件名是否正确、文件是否与 index.html 位于同一目录。')});
</script></body></html>
